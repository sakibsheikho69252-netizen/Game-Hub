  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text); display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .wrap{width:100%; max-width:480px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:14px; color:var(--muted);}
  .topbar b{color:var(--accent2); font-size:16px;}
  .card{
    background:var(--card); border-radius:20px; padding:24px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); text-align:center;
  }
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .meta{
    display:inline-block; background:rgba(255,107,107,.15); color:var(--accent);
    padding:5px 14px; border-radius:999px; font-size:13px; font-weight:600; margin-bottom:14px;
  }
  .hints{min-height:90px; text-align:right; direction:rtl;}
  .hint-line{
    background:rgba(255,255,255,.05); border-radius:12px; padding:10px 14px;
    margin-bottom:8px; font-size:15px; line-height:1.5; animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}
  .btnrow{display:flex; gap:10px; margin:16px 0;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    padding:12px 16px; font-size:15px; font-weight:600; transition:.15s transform;
  }
  button:active{transform:scale(.96);}
  .btn-hint{flex:1; background:#3a2d5c; color:var(--text);}
  .btn-hint:disabled{opacity:.35; cursor:default;}
  .options{display:grid; gap:10px; margin-top:6px; direction:rtl;}
  .opt{background:#3a2d5c; color:var(--text); text-align:right; padding:14px; border-radius:12px; font-size:15px;}
  .opt.correct{background:var(--good)!important;}
  .opt.wrong{background:var(--bad)!important;}
  .opt:disabled{cursor:default;}
  .footer{margin-top:18px; display:flex; justify-content:center;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#ff9068); color:#fff; padding:12px 28px;}
  .score-big{font-size:44px; font-weight:800; color:var(--accent2); margin:6px 0;}
  .end .card{padding:32px 20px;}
</style>

const ROUNDS = Math.min(10, MOVIES.length);
let pool = [], roundIdx = 0, score = 0, hintsShown = 1, locked = false;
let current = null, options = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startGame(){
  pool = shuffle(MOVIES).slice(0, ROUNDS);
  roundIdx = 0; score = 0;
  document.getElementById('roundTotal').textContent = ROUNDS;
  updateScore();
  nextRound();
}

function updateScore(){
  document.getElementById('scoreDisp').textContent = score;
}

function nextRound(){
  if(roundIdx >= ROUNDS){ return showEnd(); }
  current = pool[roundIdx];
  roundIdx++;
  document.getElementById('roundNo').textContent = roundIdx;
  hintsShown = 1;
  locked = false;

  document.getElementById('metaTag').textContent = current.meta;
  renderHints();

  // build options: correct + 3 distractors
  const others = shuffle(MOVIES.filter(m => m.name !== current.name)).slice(0,3);
  options = shuffle([current, ...others]);
  renderOptions();

  document.getElementById('hintBtn').disabled = (hintsShown >= current.hints.length);
  document.getElementById('nextFooter').style.display = 'none';
}

function renderHints(){
  const box = document.getElementById('hintsBox');
  box.innerHTML = '';
  for(let i=0;i<hintsShown;i++){
    const d = document.createElement('div');
    d.className = 'hint-line';
    d.textContent = current.hints[i];
    box.appendChild(d);
  }
}

function renderOptions(){
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt.name;
    b.onclick = () => pickAnswer(opt, b);
    box.appendChild(b);
  });
}

function pickAnswer(opt, btnEl){
  if(locked) return;
  locked = true;
  document.getElementById('hintBtn').disabled = true;
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = opt.name === current.name;
  if(isCorrect){
    btnEl.classList.add('correct');
    const gained = Math.max(20, 100 - (hintsShown-1)*15);
    score += gained;
  } else {
    btnEl.classList.add('wrong');
    buttons.forEach(b => { if(b.textContent === current.name) b.classList.add('correct'); });
  }
  updateScore();
  // reveal remaining hints
  hintsShown = current.hints.length;
  renderHints();
  document.getElementById('nextFooter').style.display = 'flex';
}

document.getElementById('hintBtn').onclick = () => {
  if(locked) return;
  if(hintsShown < current.hints.length){
    hintsShown++;
    renderHints();
    if(hintsShown >= current.hints.length){
      document.getElementById('hintBtn').disabled = true;
    }
  }
};

document.getElementById('nextBtn').onclick = nextRound;

function showEnd(){
  document.body.classList.add('end');
  document.querySelector('.wrap').innerHTML = `
    <div class="card">
      <h1>🎬 খেলা শেষ!</h1>
      <div class="sub">তুমি ${ROUNDS} টা সিনেমার মধ্যে খেলেছো</div>
      <div class="score-big">${score}</div>
      <div class="sub">মোট পয়েন্ট</div>
      <div class="footer" style="margin-top:20px;">
        <button class="btn-primary" onclick="location.reload()">আবার খেলো 🔄</button>
      </div>
    </div>`;
}

startGame();
</script>
</body>
</html>
